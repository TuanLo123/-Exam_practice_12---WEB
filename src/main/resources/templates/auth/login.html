<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>

<body>

    <div class="page-container">
        <div class="login-wrapper">

            <div class="column-left">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">

                        <div class="swiper-slide text-only-slide">
                            <div class="slide-content">
                                <h1 class="brand-title">S15</h1>
                                <p>Hệ thống quản lý giải pháp công nghệ toàn diện.</p>
                            </div>
                        </div>

                        <div class="swiper-slide">
                            <img th:src="@{/images/welcome/intro1.png}" src="/images/welcome/intro1.png" alt="Intro 1">
                            <div class="slide-content">
                                <h3>Tính năng vượt trội</h3>
                                <p>Tối ưu hóa quy trình làm việc và quản lý dữ liệu hiệu quả.</p>
                            </div>
                        </div>

                        <div class="swiper-slide">
                            <img th:src="@{/images/welcome/intro2.png}" src="/images/welcome/intro2.png" alt="Intro 2">
                            <div class="slide-content">
                                <h3>Bảo mật an toàn</h3>
                                <p>Phân quyền và mã hóa dữ liệu nghiêm ngặt.</p>
                            </div>
                        </div>

                        <div class="swiper-slide">
                            <img th:src="@{/images/welcome/intro3.png}" src="/images/welcome/intro3.png" alt="Intro 3">
                            <div class="slide-content">
                                <h3>Hỗ trợ 24/7</h3>
                                <p>Luôn đồng hành cùng doanh nghiệp.</p>
                            </div>
                        </div>

                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>

            <div class="column-right">
                <div class="auth-container">

                    <div class="btn">
                        <div class="slider"></div>
                        <button type="button" class="login">Đăng nhập</button>
                        <button type="button" class="signup">Đăng ký</button>
                    </div>

                    <div class="form-section">

                        <div class="login-box">
                            <h2 style="margin-bottom: 25px; font-size: 24;">Đăng nhập</h2>
                            
                            <form th:action="@{/auth/login}" method="post">
                                <input class="ele" type="text" name="username" placeholder="Tên đăng nhập" required>
                                <input class="ele" type="password" name="password" placeholder="Mật khẩu" required>
                                <button class="clkbtn" type="submit">Đăng nhập</button>
                            </form>
                        </div>

                        <div class="signup-box">
                            <h2 style="margin-bottom: 25px; font-size: 24;">Đăng ký</h2>
                            <form th:action="@{/register}" method="post">
                                <input class="ele" type="text" name="username" placeholder="Tên đăng nhập" required>
                                <input class="ele" type="email" name="email" placeholder="Email" required>
                                <input class="ele" type="password" name="password" placeholder="Mật khẩu" required>
                                <input class="ele" type="password" name="confirmPassword"
                                    placeholder="Xác nhận mật khẩu" required>
                                <button class="clkbtn" type="submit">Đăng ký</button>
                            </form>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
    loop: true,
    autoplay: {
        delay: 3000,
        disableOnInteraction: false
    },
    pagination: {
        el: ".swiper-pagination",
        clickable: true
    }
});

swiper.update();
window.dispatchEvent(new Event("resize"));
    </script>
    <script th:src="@{/js/form.js}" src="/js/form.js"></script>
</body>

</html>
